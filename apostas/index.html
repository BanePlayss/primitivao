<html lang="pt-BR">
<head>
  <meta charset="utf-8" />

  <link rel="icon" type="image/png" href="primitivao-icon.png" />
  <link rel="apple-touch-icon" href="primitivao-icon.png" />
  <link rel="shortcut icon" type="image/png" href="primitivao-icon.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#d76414" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Primitivão" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Bungee+Inline&family=Space+Grotesk:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="styles.css?v=20260729-primicord1" />
</head>
<body>
  <div id="root"></div>

  <!-- Firebase (compat SDK — global `firebase`, mais simples com Babel standalone) -->
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
  <script>
    // Config duplicado do /firebase-config.js (apostas usa compat SDK, classificação usa modular).
    firebase.initializeApp({
      apiKey: "AIzaSyB4Tu-OIAfBUfzdtY-wF9tSoBwP_36hdRg",
      authDomain: "primitivao.firebaseapp.com",
      projectId: "primitivao",
      storageBucket: "primitivao.firebasestorage.app",
      messagingSenderId: "279022752580",
      appId: "1:279022752580:web:e5f467d6e2e83bc6cc7d11",
    });
    window.db = firebase.firestore();
  </script>

  <!-- React em modo produção pra performance. Pra debugar em dev, use dev.html. -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>

  <!-- html-to-image: exporta o tabloide do Jornalista (admin) como PNG. Carrega
       async/defer — se falhar, o painel cai pro fallback "tire um print". -->
  <script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.13/dist/html-to-image.js" defer></script>

  <!-- Bump o ?v= a cada deploy importante pra forçar tabs antigos a recarregar.
       O arquivo .compiled.js é gerado pelo GitHub Action `build.yml` a partir
       do apostas-app.jsx — não editar direto. Pra desenvolver localmente
       usa dev.html que carrega o .jsx com Babel standalone. -->
  <script src="apostas-app.compiled.js?v=20260729-primicord1"></script>

  <!-- PWA: registra service worker pra cache offline + install no celular.
       Também detecta quando uma versão NOVA do app foi instalada com esta
       página ainda aberta e avisa o React (banner RECARREGAR) — sem isso o
       usuário fica preso no build velho até dar hard refresh. -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js').then((reg) => {
          const notifyUpdate = () => {
            window.__swUpdateReady = true;
            window.dispatchEvent(new CustomEvent('primitivao:sw-update'));
          };
          // Worker novo já esperando (raro com skipWaiting, mas cobre).
          if (reg.waiting && navigator.serviceWorker.controller) notifyUpdate();
          reg.addEventListener('updatefound', () => {
            const nw = reg.installing;
            if (!nw) return;
            nw.addEventListener('statechange', () => {
              // 'installed' + já existe controller = atualização (não 1ª visita).
              if (nw.state === 'installed' && navigator.serviceWorker.controller) notifyUpdate();
            });
          });
        }).catch(err => {
          console.warn('SW register failed:', err);
        });
      });
    }
  </script>
</body>
</html>
