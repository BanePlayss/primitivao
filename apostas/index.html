  <script>
    // Config duplicado do /firebase-config.js (apostas usa compat SDK, classificação usa modular).
    firebase.initializeApp({
      apiKey: "AIzaSyB4Tu-OIAfBUfzdtY-wF9tSoBwP_36hdRg",
      authDomain: "primitivao.firebaseapp.com",
      projectId: "primitivao",
      storageBucket: "primitivao.firebasestorage.app",
      messagingSenderId: "279022752580",
      appId: "1:279022752580:web:e5f467d6e2e83bc6cc7d11",
    });
    // ─── SERVIDOR: a maquina do dono, nao a nuvem ────────────────────────
    // O Firestore roda no PC do Lucas (emulador) atras de um tunel HTTPS. O
    // endereco muda a cada vez que o servidor sobe, entao o site descobre pelo
    // gist antes de montar o app.
    // NAO ha fallback pra nuvem de proposito: a nuvem tem dados ANTIGOS
    // (congelados em 2026-08-17) e cair nela silenciosamente criaria dois
    // bancos divergentes. Sem servidor, o app avisa e nao finge que esta bom.
    window.__pvServerPromise = (async () => {
      const GIST = 'https://gist.githubusercontent.com/BanePlayss/352e8949a15d0969adfaf92e5cc05d06/raw/server.json';
      try {
        const r = await fetch(GIST + '?t=' + Date.now(), { cache: 'no-store' });
        if (!r.ok) throw new Error('gist HTTP ' + r.status);
        const cfg = await r.json();
        if (!cfg || !cfg.host) throw new Error('gist sem host');
        window.db = firebase.firestore();
        window.db.settings({ host: cfg.host, ssl: cfg.ssl !== false, experimentalForceLongPolling: true });
        console.log('%c SERVIDOR: ' + cfg.host + ' ', 'background:#1f7a3a;color:#fff;font-weight:800;padding:4px 8px;');
        return { ok: true, host: cfg.host };
      } catch (e) {
        console.warn('nao achei o servidor do Primitivao:', e.message);
        window.db = firebase.firestore();   // existe pra nao quebrar o app
        window.__pvServerDown = true;
        return { ok: false, erro: e.message };
      }
    })();
  </script>

  <!-- PWA: registra service worker pra cache offline + install no celular.
       Também detecta quando uma versão NOVA do app foi instalada com esta
       página ainda aberta e avisa o React (banner RECARREGAR) — sem isso o
       usuário fica preso no build velho até dar hard refresh. -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js').then((reg) => {
          const notifyUpdate = () => {
            window.__swUpdateReady = true;
            window.dispatchEvent(new CustomEvent('primitivao:sw-update'));
          };
          // Worker novo já esperando (raro com skipWaiting, mas cobre).
          if (reg.waiting && navigator.serviceWorker.controller) notifyUpdate();
          reg.addEventListener('updatefound', () => {
            const nw = reg.installing;
            if (!nw) return;
            nw.addEventListener('statechange', () => {
              // 'installed' + já existe controller = atualização (não 1ª visita).
              if (nw.state === 'installed' && navigator.serviceWorker.controller) notifyUpdate();
            });
          });
        }).catch(err => {
          console.warn('SW register failed:', err);
        });
      });
    }
  </script>
