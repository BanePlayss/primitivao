<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>PRIMITIVÃO 2026 — Classificação</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee+Inline&family=Bungee&family=Space+Grotesk:wght@400;500;600;700;800&display=swap" />
  <style>
    :root {
      --pv-orange:    #d76414;
      --pv-charcoal:  #1c1612;
      --pv-bone:      #f4ead7;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; min-height: 100%; }
    body {
      background:
        radial-gradient(circle at 20% 10%, rgba(215,100,20,0.10), transparent 45%),
        radial-gradient(circle at 80% 90%, rgba(215,100,20,0.08), transparent 45%),
        var(--pv-bone);
      font-family: "Space Grotesk", system-ui, sans-serif;
      color: var(--pv-charcoal);
      padding: 32px 20px;
    }
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 420px;
      gap: 28px;
      max-width: 1240px;
      margin: 0 auto;
      align-items: start;
    }
    @media (max-width: 1020px) {
      .layout { grid-template-columns: 1fr; }
    }

    /* ── classificação ── */
    .stage {
      background: var(--pv-bone);
      border: 3px solid var(--pv-charcoal);
      box-shadow: 8px 8px 0 var(--pv-charcoal);
      overflow: hidden;
    }
    .head {
      background: var(--pv-charcoal); color: var(--pv-bone);
      padding: 24px 28px 22px; position: relative; overflow: hidden;
    }
    .head::after {
      content:''; position:absolute; inset:0;
      background-image: radial-gradient(rgba(244,234,215,0.08) 1px, transparent 1px);
      background-size: 14px 14px; pointer-events:none;
    }
    .head-row { display:flex; align-items:center; gap:16px; position:relative; z-index:1; }
    .head-title { font-family:"Bungee Inline",Impact,sans-serif; font-size:32px; line-height:1; letter-spacing:0.02em; }
    .head-sub { font-size:11px; font-weight:700; letter-spacing:0.32em; margin-top:8px; color:var(--pv-orange); }
    .legend {
      display:flex; gap:18px; padding:12px 28px;
      font-size:10px; font-weight:700; letter-spacing:0.18em;
      color:rgba(28,22,18,0.6); background:rgba(199,84,24,0.05);
      border-bottom:2px solid var(--pv-charcoal);
    }
    .swatch { display:inline-block; width:10px; height:10px; margin-right:6px; vertical-align:middle; }
    .thead, .row {
      display:grid; grid-template-columns:38px 1fr 32px 32px 32px 32px 48px 48px;
      align-items:center; padding:11px 24px; gap:4px;
    }
    .thead { font-size:10px; font-weight:800; letter-spacing:0.18em; color:rgba(28,22,18,0.55); border-bottom:2px solid var(--pv-charcoal); }
    .row { font-size:14px; border-bottom:1px dashed rgba(28,22,18,0.18); }
    .row:nth-child(even) { background: rgba(199,84,24,0.04); }
    .row:last-child { border-bottom:none; }
    .pos { font-family:"Bungee Inline",Impact,sans-serif; font-size:20px; }
    .name { display:flex; align-items:center; gap:10px; min-width:0; }
    .name-row1 { font-weight:700; line-height:1.1; font-size:14px; }
    .name-row2 { font-size:9px; color:rgba(28,22,18,0.5); letter-spacing:0.2em; font-weight:700; margin-top:2px; }
    .num { text-align:center; font-variant-numeric:tabular-nums; font-size:13px; }
    .num.bold { font-weight:700; }
    .num.muted { color:rgba(28,22,18,0.45); }
    .pts { text-align:right; font-family:"Bungee Inline",Impact,sans-serif; font-size:22px; }
    .footer-info {
      padding:14px 24px; font-size:9.5px; font-weight:700; letter-spacing:0.32em;
      color:rgba(28,22,18,0.5); display:flex; justify-content:space-between;
      border-top:2px dashed rgba(28,22,18,0.25);
    }
    .crest-mini { width:26px; height:32px; flex-shrink:0; }
    .row.glory .pos { color:var(--pv-orange); }
    .row.relegation .pos { color:rgba(28,22,18,0.35); }
    .row.relegation .name-row1 { color:rgba(28,22,18,0.55); }

    /* ── partidas ── */
    .matches { display:flex; flex-direction:column; gap:16px; }

    /* round picker */
    .round-picker {
      background:var(--pv-orange); color:var(--pv-charcoal);
      border:3px solid var(--pv-charcoal); box-shadow:8px 8px 0 var(--pv-charcoal);
      padding:16px 18px 18px;
    }
    .round-picker-top {
      display:flex; align-items:center; gap:14px; margin-bottom:14px;
    }
    .round-picker-text { font-family:"Bungee Inline",Impact,sans-serif; font-size:22px; line-height:1; }
    .round-picker-sub { font-size:10px; font-weight:800; letter-spacing:0.32em; margin-top:6px; }
    .round-tabs {
      display:grid; grid-template-columns:repeat(7,1fr); gap:4px;
    }
    .round-tab {
      background:var(--pv-bone); color:var(--pv-charcoal);
      border:2px solid var(--pv-charcoal); cursor:pointer;
      font-family:"Bungee Inline",Impact,sans-serif; font-size:13px;
      padding:6px 0; text-align:center; letter-spacing:0.04em;
      transition:transform 0.06s;
    }
    .round-tab:hover { background:var(--pv-charcoal); color:var(--pv-bone); }
    .round-tab.active { background:var(--pv-charcoal); color:var(--pv-bone); transform:translateY(-2px); box-shadow:0 2px 0 var(--pv-bone); }

    /* match card */
    .match-card {
      background:var(--pv-bone); border:3px solid var(--pv-charcoal);
      box-shadow:6px 6px 0 var(--pv-charcoal); overflow:hidden;
    }
    .match-card.played { box-shadow:6px 6px 0 var(--pv-orange); }
    .match-head {
      background:var(--pv-charcoal); color:var(--pv-bone);
      padding:8px 14px; display:flex; justify-content:space-between; align-items:center;
      font-size:9.5px; font-weight:800; letter-spacing:0.32em;
    }
    .match-head .pill {
      background:var(--pv-orange); color:var(--pv-charcoal);
      padding:3px 8px; font-family:"Bungee Inline",Impact,sans-serif;
      letter-spacing:0.05em; font-size:11px;
    }
    .match-head.played .pill { background:#3a8a3e; color:var(--pv-bone); }
    .match-body {
      display:grid; grid-template-columns:1fr 84px 1fr; gap:8px;
      padding:14px 12px 8px; align-items:center;
    }
    .team-block { display:flex; flex-direction:column; align-items:center; gap:6px; }
    .team-block .sh { font-size:8.5px; font-weight:800; letter-spacing:0.28em; color:var(--pv-orange); }
    .team-select {
      width:100%; max-width:120px;
      background:transparent; border:2px solid var(--pv-charcoal);
      font-family:"Bungee Inline",Impact,sans-serif; font-size:12px;
      padding:4px 6px; text-align:center; cursor:pointer;
      letter-spacing:0.02em; color:var(--pv-charcoal);
    }
    .team-select:focus { outline:none; background:rgba(215,100,20,0.12); }

    /* score input center */
    .score-box {
      display:flex; flex-direction:column; align-items:center; gap:4px;
    }
    .score-row {
      display:flex; gap:4px; align-items:center;
    }
    .score-input {
      width:34px; height:46px;
      background:var(--pv-bone); border:2px solid var(--pv-charcoal);
      font-family:"Bungee Inline",Impact,sans-serif; font-size:24px;
      text-align:center; color:var(--pv-charcoal); padding:0;
      font-variant-numeric:tabular-nums;
    }
    .score-input::placeholder { color:rgba(28,22,18,0.25); }
    .score-input:focus { outline:none; background:rgba(215,100,20,0.15); }
    .score-input.win { background:var(--pv-orange); color:var(--pv-bone); }
    .score-x {
      font-family:"Bungee Inline",Impact,sans-serif; font-size:16px;
      color:rgba(28,22,18,0.55);
    }
    .score-label {
      font-size:8.5px; font-weight:800; letter-spacing:0.28em;
      color:rgba(28,22,18,0.5);
    }
    .score-label.played { color:#3a8a3e; }

    .match-foot {
      border-top:1px dashed rgba(28,22,18,0.25);
      padding:9px 12px; display:flex; gap:8px; align-items:center;
      font-size:11px; font-weight:700; letter-spacing:0.06em; color:rgba(28,22,18,0.7);
      flex-wrap:wrap;
    }
    .match-foot input.fld {
      background:transparent; border:none; border-bottom:1.5px dashed rgba(28,22,18,0.5);
      font-family:"Space Grotesk",sans-serif; font-weight:700; letter-spacing:0.06em;
      font-size:11px; color:var(--pv-charcoal); padding:2px 0;
    }
    .match-foot input.f-day { width:46px; text-transform:uppercase; }
    .match-foot input.f-date { width:60px; text-transform:uppercase; }
    .match-foot input.f-time { width:48px; }
    .match-foot input:focus { outline:none; border-bottom-color:var(--pv-orange); background:rgba(215,100,20,0.08); }
    .match-foot label { font-size:9px; letter-spacing:0.2em; color:rgba(28,22,18,0.5); margin-right:2px; }
    .match-foot .clear-btn {
      margin-left:auto; background:transparent; border:1.5px solid rgba(28,22,18,0.4);
      color:rgba(28,22,18,0.65); font-size:9px; letter-spacing:0.2em; font-weight:800;
      padding:3px 8px; cursor:pointer;
    }
    .match-foot .clear-btn:hover { border-color:var(--pv-orange); color:var(--pv-orange); }

    .toolbar {
      display:flex; gap:10px; flex-wrap:wrap; align-items:center;
      padding:12px 18px; background:rgba(28,22,18,0.04);
      border:2px dashed rgba(28,22,18,0.3);
    }
    .toolbar button {
      background:var(--pv-charcoal); color:var(--pv-bone); border:none;
      font-family:"Bungee Inline",Impact,sans-serif; letter-spacing:0.04em;
      font-size:11px; padding:7px 12px; cursor:pointer;
    }
    .toolbar button.ghost { background:transparent; color:var(--pv-charcoal); border:2px solid var(--pv-charcoal); padding:5px 10px; }
    .toolbar button:hover { background:var(--pv-orange); color:var(--pv-charcoal); }
    .toolbar .label { font-size:10px; letter-spacing:0.28em; font-weight:800; color:rgba(28,22,18,0.6); }
  </style>
</head>
<body>
  <div class="layout">
    <main class="stage">
      <header class="head">
        <div class="head-row">
          <svg viewBox="0 0 120 140" width="62" height="72" aria-hidden="true">
            <g transform="translate(60 70)">
              <g transform="rotate(38)">
                <rect x="-1.2" y="-66" width="2.4" height="132" fill="#f4ead7" />
                <path d="M0 -72 L -5 -60 L 0 -64 L 5 -60 Z" fill="#f4ead7" />
              </g>
              <g transform="rotate(-38)">
                <rect x="-1.2" y="-66" width="2.4" height="132" fill="#f4ead7" />
                <path d="M0 -72 L -5 -60 L 0 -64 L 5 -60 Z" fill="#f4ead7" />
              </g>
            </g>
            <path d="M14 18 L 106 18 L 106 70 C 106 102 96 116 60 132 C 24 116 14 102 14 70 Z"
                  fill="#d76414" stroke="#f4ead7" stroke-width="3" stroke-linejoin="miter" />
            <rect x="14" y="32" width="92" height="14" fill="#1c1612" />
            <text x="60" y="42" font-family="Bungee Inline, Impact, sans-serif" font-size="9" letter-spacing="0.5" fill="#f4ead7" text-anchor="middle">PRIMITIVÃO</text>
            <g transform="translate(60 86)">
              <path d="M0 -28 C -16 -28 -22 -16 -22 0 C -22 16 -14 30 0 32 C 14 30 22 16 22 0 C 22 -16 16 -28 0 -28 Z" fill="#1c1612" />
              <path d="M-12 -10 L -4 -10 L -8 -2 Z" fill="#f4ead7" />
              <path d="M4 -10 L 12 -10 L 8 -2 Z" fill="#f4ead7" />
              <rect x="-1" y="0" width="2" height="10" fill="#f4ead7" />
              <path d="M-10 16 L -7 20 L -4 16 L -1 20 L 2 16 L 5 20 L 8 16 L 10 18 L 10 24 L -10 24 Z" fill="#f4ead7" />
            </g>
          </svg>
          <div>
            <div class="head-title">CLASSIFICAÇÃO</div>
            <div class="head-sub" id="head-sub">PRIMITIVÃO 2026 · 7 RODADAS · IDA</div>
          </div>
        </div>
      </header>

      <div class="legend">
        <div><span class="swatch" style="background:var(--pv-orange)"></span>ZONA DE GLÓRIA</div>
        <div><span class="swatch" style="background:rgba(28,22,18,0.4)"></span>ZONA DE VERGONHA</div>
      </div>

      <div class="thead">
        <div>#</div><div>TIME</div>
        <div class="num">J</div><div class="num">V</div><div class="num">E</div><div class="num">D</div>
        <div class="num">SG</div><div style="text-align:right">P</div>
      </div>

      <div id="rows"></div>

      <footer class="footer-info">
        <div>SEASON 1 · 8 GUERREIROS</div>
        <div id="footer-info-right">7 RODADAS · 28 JOGOS · IDA</div>
      </footer>
    </main>

    <aside class="matches">
      <!-- ROUND PICKER -->
      <div class="round-picker">
        <div class="round-picker-top">
          <svg viewBox="0 0 80 100" width="44" height="56" aria-hidden="true">
            <g fill="#1c1612" stroke="#1c1612" stroke-width="1.5">
              <ellipse cx="22" cy="10" rx="5" ry="4" />
              <ellipse cx="58" cy="10" rx="5" ry="4" />
              <rect x="22" y="8" width="36" height="4" />
            </g>
            <path d="M14 22 C 4 26 4 42 14 46" fill="none" stroke="#1c1612" stroke-width="3" />
            <path d="M66 22 C 76 26 76 42 66 46" fill="none" stroke="#1c1612" stroke-width="3" />
            <path d="M14 18 L 66 18 L 62 50 C 62 58 56 64 40 64 C 24 64 18 58 18 50 Z" fill="#1c1612" />
            <path d="M28 28 L 32 24 L 28 32 L 32 36" stroke="#f4ead7" stroke-width="1.5" fill="none" />
            <path d="M48 26 L 52 30 L 48 34" stroke="#f4ead7" stroke-width="1.5" fill="none" />
            <circle cx="40" cy="40" r="4" fill="none" stroke="#f4ead7" stroke-width="1.5" />
            <rect x="32" y="64" width="16" height="6" fill="#1c1612" />
            <rect x="22" y="70" width="36" height="6" fill="#1c1612" />
            <rect x="18" y="76" width="44" height="8" fill="#1c1612" />
          </svg>
          <div>
            <div class="round-picker-text" id="round-title">RODADA 01</div>
            <div class="round-picker-sub">PRIMITIVÃO · 2026 · IDA</div>
          </div>
        </div>
        <div class="round-tabs" id="round-tabs"></div>
      </div>

      <div class="toolbar">
        <span class="label">EDITAR</span>
        <button id="btn-reset" class="ghost" type="button">Resetar rodada</button>
        <button id="btn-shuffle" type="button">Sortear confrontos</button>
      </div>

      <div id="matches-list"></div>
    </aside>
  </div>

<script>
  // ─────────────── DADOS ─────────────────────────────
  const TEAMS = [
    { id: 'bane',    name: 'Bane',    short: 'BAN', color: '#1c1612' },
    { id: 'mohamed', name: 'Mohamed', short: 'MOH', color: '#c75418' },
    { id: 'potato',  name: 'Potato',  short: 'PTT', color: '#8b3a14' },
    { id: 'magreza', name: 'Magreza', short: 'MGR', color: '#2a201a' },
    { id: 'celin',   name: 'Celin',   short: 'CEL', color: '#e8800f' },
    { id: 'juca',    name: 'Juca',    short: 'JUC', color: '#d63c0a' },
    { id: 'caco',    name: 'Caco',    short: 'CAC', color: '#4a3020' },
    { id: 'vitinho', name: 'Vitinho', short: 'VIT', color: '#6e4824' },
  ];
  const byId = id => TEAMS.find(t => t.id === id);
  const TOTAL_ROUNDS = 7; // só ida, 8 times, 7 rodadas

  function crestSvg(color, size = 26) {
    return `
      <svg class="crest-mini" viewBox="0 0 100 120" width="${size}" height="${size * 1.23}" aria-hidden="true">
        <path d="M10 12 L 90 12 L 90 62 C 90 90 82 104 50 118 C 18 104 10 90 10 62 Z"
              fill="${color}" stroke="#1c1612" stroke-width="4" />
        <path d="M18 20 L 82 20 L 82 60 C 82 84 76 96 50 108 C 24 96 18 84 18 60 Z"
              fill="none" stroke="#f4ead7" stroke-width="1.5" opacity="0.55" />
        <circle cx="50" cy="58" r="14" fill="#f4ead7" />
        <path d="M42 56 L 46 56 L 44 60 Z M58 56 L 54 56 L 56 60 Z" fill="#1c1612" />
        <path d="M44 66 L 56 66 L 50 72 Z" fill="#1c1612" />
      </svg>`;
  }

  // ─── Round-robin "circle method" para gerar 7 rodadas únicas ───
  function generateSchedule(teamIds) {
    const ids = teamIds.slice();
    const n = ids.length;
    const rounds = [];
    const fixed = ids[0];
    let rotating = ids.slice(1);
    for (let r = 0; r < n - 1; r++) {
      const arr = [fixed, ...rotating];
      const games = [];
      for (let i = 0; i < n / 2; i++) {
        const home = arr[i];
        const away = arr[n - 1 - i];
        // alterna mando
        games.push(r % 2 === 0
          ? { home, away }
          : { home: away, away: home });
      }
      rounds.push(games);
      rotating = [rotating[rotating.length - 1], ...rotating.slice(0, -1)];
    }
    return rounds;
  }

  // ─── Default: 7 rodadas geradas, datas semanais ───
  const DAYS = ['SEG','TER','QUA','QUI','SEX','SÁB','DOM'];
  function defaultRounds() {
    const sched = generateSchedule(TEAMS.map(t => t.id));
    const startDate = new Date(2026, 4, 4); // 04/05/2026 (segunda)
    return sched.map((games, ri) => {
      const base = new Date(startDate);
      base.setDate(base.getDate() + ri * 7);
      return games.map((g, gi) => {
        const d = new Date(base);
        d.setDate(d.getDate() + gi); // distribui SEG/TER/QUA/QUI
        const day = DAYS[d.getDay() === 0 ? 6 : d.getDay() - 1];
        const date = `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`;
        return {
          home: g.home, away: g.away,
          day, date, time: gi % 2 === 0 ? '21:00' : '21:30',
          gh: '', ga: '', // gols (vazios = não jogado)
        };
      });
    });
  }

  // ─────────────── ESTADO + STORAGE ──────────────────
  const STORAGE_KEY = 'primitivao-state-v2';

  let state = loadState();

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const s = JSON.parse(raw);
        if (s && Array.isArray(s.rounds) && s.rounds.length === TOTAL_ROUNDS) return s;
      }
    } catch(e) {}
    return { currentRound: 0, rounds: defaultRounds() };
  }
  function saveState() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
  }

  // ─────────────── CÁLCULO DA TABELA ─────────────────
  function computeStandings() {
    const rec = {};
    TEAMS.forEach(t => rec[t.id] = { ...t, j:0, v:0, e:0, d:0, gp:0, gc:0, p:0 });
    state.rounds.forEach(round => {
      round.forEach(m => {
        const gh = parseInt(m.gh, 10);
        const ga = parseInt(m.ga, 10);
        if (Number.isNaN(gh) || Number.isNaN(ga)) return;
        const H = rec[m.home], A = rec[m.away];
        if (!H || !A) return;
        H.j++; A.j++;
        H.gp += gh; H.gc += ga;
        A.gp += ga; A.gc += gh;
        if (gh > ga) { H.v++; A.d++; H.p += 3; }
        else if (gh < ga) { A.v++; H.d++; A.p += 3; }
        else { H.e++; A.e++; H.p += 1; A.p += 1; }
      });
    });
    const arr = Object.values(rec);
    arr.sort((a,b) => {
      if (b.p !== a.p) return b.p - a.p;
      const sgA = a.gp - a.gc, sgB = b.gp - b.gc;
      if (sgB !== sgA) return sgB - sgA;
      if (b.v !== a.v) return b.v - a.v;
      if (b.gp !== a.gp) return b.gp - a.gp;
      return a.name.localeCompare(b.name);
    });
    return arr;
  }

  // ─────────────── RENDER: TABELA ────────────────────
  function renderStandings() {
    const standings = computeStandings();
    document.getElementById('rows').innerHTML = standings.map((s, i) => {
      const sg = s.gp - s.gc;
      const cls = i < 2 ? 'row glory' : i >= standings.length - 2 ? 'row relegation' : 'row';
      return `
        <div class="${cls}">
          <div class="pos">${String(i + 1).padStart(2, '0')}</div>
          <div class="name">
            ${crestSvg(s.color, 26)}
            <div>
              <div class="name-row1">${s.name}</div>
              <div class="name-row2">${s.short}</div>
            </div>
          </div>
          <div class="num">${s.j}</div>
          <div class="num bold">${s.v}</div>
          <div class="num">${s.e}</div>
          <div class="num muted">${s.d}</div>
          <div class="num">${sg > 0 ? '+' + sg : sg}</div>
          <div class="pts">${s.p}</div>
        </div>`;
    }).join('');
  }

  // ─────────────── RENDER: ROUND PICKER ──────────────
  function renderRoundTabs() {
    const tabs = document.getElementById('round-tabs');
    tabs.innerHTML = Array.from({ length: TOTAL_ROUNDS }).map((_, i) => {
      const cls = i === state.currentRound ? 'round-tab active' : 'round-tab';
      return `<button class="${cls}" data-r="${i}" type="button">${String(i+1).padStart(2,'0')}</button>`;
    }).join('');
    tabs.querySelectorAll('.round-tab').forEach(b => {
      b.addEventListener('click', () => {
        state.currentRound = +b.dataset.r;
        saveState();
        renderAll();
      });
    });
    document.getElementById('round-title').textContent = `RODADA ${String(state.currentRound+1).padStart(2,'0')}`;
  }

  // ─────────────── RENDER: CARDS ─────────────────────
  function teamOptions(selectedId) {
    return TEAMS.map(t =>
      `<option value="${t.id}" ${t.id === selectedId ? 'selected' : ''}>${t.name.toUpperCase()}</option>`
    ).join('');
  }

  function renderMatches() {
    const round = state.rounds[state.currentRound];
    const list = document.getElementById('matches-list');
    list.innerHTML = round.map((m, i) => {
      const h = byId(m.home);
      const a = byId(m.away);
      const gh = m.gh, ga = m.ga;
      const ghN = parseInt(gh,10), gaN = parseInt(ga,10);
      const played = !Number.isNaN(ghN) && !Number.isNaN(gaN);
      const homeWin = played && ghN > gaN;
      const awayWin = played && gaN > ghN;
      const draw = played && ghN === gaN;

      return `
        <div class="match-card ${played ? 'played' : ''}" data-i="${i}">
          <div class="match-head ${played ? 'played' : ''}">
            <div>JOGO ${String(i + 1).padStart(2, '0')}</div>
            <div class="pill">${played ? 'FINAL' : (m.day || '—') + ' · ' + (m.time || '—')}</div>
          </div>
          <div class="match-body">
            <div class="team-block">
              ${crestSvg(h.color, 48)}
              <select class="team-select" data-field="home">${teamOptions(m.home)}</select>
              <div class="sh">MANDANTE</div>
            </div>

            <div class="score-box">
              <div class="score-row">
                <input class="score-input ${homeWin ? 'win' : ''}" data-field="gh"
                       inputmode="numeric" maxlength="2" placeholder="–"
                       value="${gh ?? ''}" />
                <span class="score-x">×</span>
                <input class="score-input ${awayWin ? 'win' : ''}" data-field="ga"
                       inputmode="numeric" maxlength="2" placeholder="–"
                       value="${ga ?? ''}" />
              </div>
              <div class="score-label ${played ? 'played' : ''}">
                ${played ? (draw ? 'EMPATE' : (homeWin ? h.short + ' VENCEU' : a.short + ' VENCEU')) : 'PLACAR'}
              </div>
            </div>

            <div class="team-block">
              ${crestSvg(a.color, 48)}
              <select class="team-select" data-field="away">${teamOptions(m.away)}</select>
              <div class="sh">VISITANTE</div>
            </div>
          </div>
          <div class="match-foot">
            <label>DIA</label>
            <input class="fld f-day" data-field="day" value="${m.day || ''}" maxlength="3" />
            <label>DATA</label>
            <input class="fld f-date" data-field="date" value="${m.date || ''}" maxlength="8" />
            <label>HORA</label>
            <input class="fld f-time" data-field="time" value="${m.time || ''}" maxlength="5" />
            <button class="clear-btn" data-act="clear-score" type="button">LIMPAR PLACAR</button>
          </div>
        </div>`;
    }).join('');

    // listeners
    list.querySelectorAll('.match-card').forEach(card => {
      const i = +card.dataset.i;
      card.querySelectorAll('select, input').forEach(el => {
        const evt = el.tagName === 'SELECT' ? 'change' : 'input';
        el.addEventListener(evt, () => {
          const field = el.dataset.field;
          let v = el.value;
          if (field === 'day' || field === 'date') v = v.toUpperCase();
          if (field === 'gh' || field === 'ga') v = v.replace(/[^0-9]/g,'').slice(0,2);
          state.rounds[state.currentRound][i][field] = v;
          saveState();
          // re-render quando muda time, placar, dia ou hora (afeta crest/pill/tabela)
          if (['home','away','gh','ga','day','time'].includes(field)) {
            renderMatches();
            renderStandings();
          }
        });
      });
      card.querySelector('[data-act="clear-score"]').addEventListener('click', () => {
        state.rounds[state.currentRound][i].gh = '';
        state.rounds[state.currentRound][i].ga = '';
        saveState();
        renderMatches();
        renderStandings();
      });
    });
  }

  // ─────────────── TOOLBAR ───────────────────────────
  document.getElementById('btn-reset').addEventListener('click', () => {
    if (!confirm('Resetar a rodada ' + String(state.currentRound+1).padStart(2,'0') + '? (placares e horários voltam ao padrão)')) return;
    const def = defaultRounds();
    state.rounds[state.currentRound] = def[state.currentRound];
    saveState();
    renderAll();
  });

  document.getElementById('btn-shuffle').addEventListener('click', () => {
    const ids = TEAMS.map(t => t.id);
    for (let i = ids.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [ids[i], ids[j]] = [ids[j], ids[i]];
    }
    const round = state.rounds[state.currentRound];
    round.forEach((m, i) => {
      m.home = ids[i*2];
      m.away = ids[i*2+1];
      m.gh = ''; m.ga = '';
    });
    saveState();
    renderAll();
  });

  // ─────────────── INIT ──────────────────────────────
  function renderAll() {
    renderRoundTabs();
    renderMatches();
    renderStandings();
  }
  renderAll();
</script>
</body>
</html>
